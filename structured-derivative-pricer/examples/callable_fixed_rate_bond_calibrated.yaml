# Same 10NC2 callable fixed-rate bond as callable_fixed_rate_bond.yaml, with Hull-White calibrated to the
# market instead of given parameters: mean reversion is held at 3% and the volatility is fitted to the
# coterminal ATM swaptions (1Yx9Y, 2Yx8Y, ..., 9Yx1Y) of the USD normal swaption vol matrix, the
# instruments whose optionality a Bermudan call into the bond's remaining life resembles.
# result.model_diagnostics.calibration lists the market and model vol of every swaption. The mock vols
# have a short-expiry hump a constant-sigma model cannot match, so the result warns that 1Yx9Y misses.
valuation_date: 2026-09-28
market_data: market/mock_market.yaml

model:
  type: hull_white
  discount_curve: USD
  mean_reversion: 0.03            # fixed; set calibration.calibrate_mean_reversion: true to fit it too
  calibration:
    swaption_vol: USD             # market_data.swaption_vols.USD
    instruments: coterminal       # or: all, or [{expiry: 2Y, tenor: 8Y}, ...]

schedules:
  semiannual: {type: generated, frequency: 6M, calendar: UnitedStates.GovernmentBond}
  call_dates: {type: generated, frequency: 6M, start: 2Y, end: 90M, include_start: true,
               calendar: UnitedStates.GovernmentBond}

trade:
  id: CALLABLE-10NC2-CAL
  maturity: 10Y
  legs:
    - {id: coupons, type: fixed_leg, rate: 0.0425, notional: 1000000, schedule: semiannual,
       day_count: Thirty360.BondBasis}
    - {id: principal, type: fixed_amount, amount: 1000000, payment_date: maturity}
  termination_events:
    - {id: issuer_call, type: bermudan_call, observation: call_dates, exerciser: issuer,
       exercise_price: 1000000}

pricing: {num_paths: 20000, seed: 7}
