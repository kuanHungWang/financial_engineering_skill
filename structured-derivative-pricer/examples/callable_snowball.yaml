# 5Y callable snowball note, investor's view, notional 1,000,000.
#   - coupon rate C_k = max(C_{k-1} + K_k - USD 3M term rate, 0), C_0 = 0, paid quarterly, Act/360; the 3M rate
#     is fixed in advance (2 business days before each period); K steps up from 4.5% to 5% after year 2
#   - callable by the issuer at par on every coupon date after year 1 (that date's coupon is still paid)
#   - par redemption at maturity
# A snowball's coupon depends on all earlier fixings, so the coupon is a path_dependent leg whose state C is the
# current coupon rate. The issuer's call decision depends on that state, so C is a regressor of the call (with
# the 3M rate). Hull-White 1F: the 0% floor is an option on rates, so rates must be stochastic.
valuation_date: 2026-09-28
market_data: market/mock_market.yaml

model: {type: hull_white, discount_curve: USD, mean_reversion: 0.03, volatility: 0.01}

observables:
  L3M:
    type: term_rate
    curve: USD
    tenor: 3M
    calendar: UnitedStates.GovernmentBond
    history: {2026-09-24: 0.0426}   # first coupon's fixing, 2 business days before the start (mock value)

schedules:
  quarterly: {type: generated, frequency: 3M, calendar: UnitedStates.GovernmentBond}
  call_dates: {type: generated, frequency: 3M, start: 1Y, end: 45M, include_start: true, calendar: UnitedStates.GovernmentBond}

trade:
  id: SNOWBALL-5NC1
  maturity: 5Y
  legs:
    - id: coupons
      type: path_dependent
      notional: 1000000
      schedule: quarterly
      day_count: Actual360
      inputs:
        L: {observable: L3M, fixing: in_advance, fixing_lag: 2, fixing_calendar: UnitedStates.GovernmentBond}
      parameters:
        K: {effective_date: 0.045, 2Y: 0.05}
      state:
        C: {initial: 0.0, evolve: "max(C + K - L, 0)"}
      payoff: "C * tau"
    - {id: principal, type: fixed_amount, amount: 1000000, payment_date: maturity}
  termination_events:
    - {id: issuer_call, type: bermudan_call, observation: call_dates, exerciser: issuer,
       exercise_price: 1000000, regressors: [L3M, coupons.C]}

pricing: {num_paths: 20000, seed: 5}
